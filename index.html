<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b10" />
    <meta
      name="description"
      content="Portfólio de João Pedro Toaldo — Desenvolvedor de Software. Estudante de Sistemas de Informação na Universidade Franciscana (UFN)."
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://joaopedrotoaldo.pages.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="João Pedro Toaldo | Desenvolvedor de Software" />
    <meta property="og:description" content="Portfólio de João Pedro Toaldo — Desenvolvedor de Software. Estudante de Sistemas de Informação na Universidade Franciscana (UFN)." />
    <meta property="og:url" content="https://joaopedrotoaldo.pages.dev/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://joaopedrotoaldo.pages.dev/og-image.png" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="João Pedro Toaldo | Desenvolvedor de Software" />
    <meta name="twitter:description" content="Portfólio de João Pedro Toaldo — Desenvolvedor de Software. Estudante de Sistemas de Informação na Universidade Franciscana (UFN)." />
    <meta name="twitter:image" content="https://joaopedrotoaldo.pages.dev/og-image.png" />

    <!-- Preconnect para conexões críticas (inclui DNS lookup) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fontes: preload da CSS combinada com display=optional para evitar CLS de font-switching -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=optional"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=optional"
        rel="stylesheet"
      />
    </noscript>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>João Pedro Toaldo | Desenvolvedor de Software</title>

    <!-- CSS crítico inline — evita render-blocking e CLS -->
    <style>
      /* Prevenir flash of unstyled content */
      html, body, #root {
        height: 100%;
      }
      body {
        margin: 0;
        background-color: #0a0b10;
        color: #e6e8f0;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        color-scheme: dark;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
        /* Safe area para dispositivos com notch/dynamic island */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* Loading indicator, evita CLS ao não depender de :empty */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root:empty::before {
        content: "";
        width: 40px;
        height: 40px;
        border: 3px solid rgba(77, 170, 252, 0.2);
        border-top-color: #4daafc;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
