<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="18" fill="#6366f1"/>
  <g transform="translate(25,20)">
    <!-- Neural network nodes -->
    <circle cx="25" cy="15" r="6" fill="#fff"/>
    <circle cx="25" cy="45" r="6" fill="#fff"/>
    <circle cx="25" cy="75" r="6" fill="#fff"/>
    <circle cx="50" cy="30" r="6" fill="#fff"/>
    <circle cx="50" cy="60" r="6" fill="#fff"/>

    <!-- Connections -->
    <line x1="31" y1="15" x2="44" y2="30" stroke="#fff" stroke-width="2" opacity="0.7"/>
    <line x1="31" y1="45" x2="44" y2="30" stroke="#fff" stroke-width="2" opacity="0.7"/>
    <line x1="31" y1="45" x2="44" y2="60" stroke="#fff" stroke-width="2" opacity="0.7"/>
    <line x1="31" y1="75" x2="44" y2="60" stroke="#fff" stroke-width="2" opacity="0.7"/>

    <!-- Output node -->
    <circle cx="70" cy="45" r="8" fill="#fff"/>
    <text x="70" y="49" text-anchor="middle" fill="#6366f1" font-size="10" font-weight="bold">LLM</text>
